%YAML:1.0
---
# 相机标定配置。任务书 §3.3 产出 / §6 提交物。
#
# 两个坐标系的轴向约定。`云台外参.md:22` 要求提交材料必须说明。
#   相机坐标系：x 向右、y 向下、z 沿光轴向前，OpenCV 针孔模型的标准约定
#   云台坐标系：x 向前、y 向左、z 向上
#
#   依据：学长 2026-10-15 答复「云台系和世界系一样」。
#   EKF 的世界系就是 armor/include/BulletModel.hpp:6 的 前 x / 左 y / 上 z，
#   云台系取同一套轴向，两系之间就只剩一个绕竖直轴的偏航角，不再有基础变换。
#
#   代价：相机系与云台系不再同向，旋转外参不是单位阵，而是下面那个 90 度置换矩阵。
#   学长 2026-10-10 说的「相机系和云台系只有平移、没有旋转」与这一条不能同时成立，
#   两系差 90 度；分析与两处数据的佐证见 docs/上车前问题清单.md 第 1.1 节。
#
#   这一条同时解释了外参平移的轴序：只有在前 / 左 / 上 里读，
#   相机才落在俯仰轴的前上方、横向居中，也就是 (前 70.8, 左 0, 上 84.3) mm。
#   2026-10-24 换相机前是 (前 67.11, 左 0, 上 51.5) mm。
calibrated: 1

# 标定图像分辨率，单位 pixel。
# 相机 2026-10-24 换了一支，标定仍在 1440x1080 下做，新旧同分辨率。
# 主点 (679.3, 571.8) 相对画面中心 (720, 540) 偏 (-40.7, 31.8) px，
# 与上一支镜头 (-30.6, 34.7) 同量级。
# 若车上改用别的分辨率，fx/fy/cx/cy 要一起换算；只有新分辨率是标定图的纯缩放
# 才能同乘一个比例，若是 ROI 裁切则 cx/cy 的偏移量要单独算。
image_width: 1440
image_height: 1080

# 相机内参矩阵 K。
# 来源：车上那台机器 2026-10-24 的标定，数值取自它的 CameraConfig.yaml。
# 主点是未翻转的值，HikCamera::grab 里不再转 180 度，两者对应。
#
# 上一支镜头，2026-10-13 至 2026-10-24 在用，仅供对照与回放旧视频：
#   fx 1782.6 / fy 1784.3 / cx 689.6 / cy 504.3。那支是倒装的，画面在 grab 里
#   转过 180 度，所以 cx / cy 是 (749.4, 574.7) 翻转后的值；标定原值未翻转。
#
# fx 从 1782.6 涨到 2433.8，是 1.365 倍，水平视场角从 44.0 度收到 33.0 度，
# 是另一支镜头而不是同一支重标。换镜头不动目标车，装甲板半径与板高表照旧。
#
# 判据不是重投影误差，而是画面四角的径向缩放因子 1+k1r²+k2r⁴+k3r⁶（系数见畸变一节）：
# 新系数按 1440x1080 算，四角为 0.989~0.993，正常镜头落在 0.98~1.02。
# 低重投影误差 ≠ 标定正确：更早一轮误差 0.0753 px 看着很好，四角却缩到 0.66，
# 只因棋盘格仅覆盖画面 44% 半径、高阶系数外推无约束。
camera_matrix: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 2433.8,    0.0,  679.3,
             0.0, 2437.4,  571.8,
             0.0,    0.0,    1.0 ]

# 畸变系数，顺序 [k1, k2, p1, p2, k3]，OpenCV pinhole 模型。
# 来源同上，2026-10-24 换的这支镜头。
#   上一支仅供对照：[ -0.0357, -0.1533, 0.0, 0.0, 1.1905 ]。
# k2 = -0.3517 与 k3 = -0.1536 同号，四角径向因子 0.989~0.993，没有上一支那种
# 高低阶互相抵消。
# p1 = p2 = 0 是标定未估计切向畸变所致，切向填 0 在 OpenCV 针孔模型中是完全合法的取值。
distortion_coefficients: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.0129, -0.3517, 0.0, 0.0, -0.1536 ]

# 相机坐标系 -> 云台坐标系的旋转矩阵 R_gimbal_camera。
#
# 按上面的轴向约定，相机系是 右 / 下 / 前，云台系是 前 / 左 / 上，两系差一个 90 度置换。
# 逐轴写出来就是：相机的 +x（右）落在云台系的 -y（右即左的负向），
# 相机的 +y（下）落在云台系的 -z，相机的 +z（前）落在云台系的 +x。
# 三条就是矩阵的三列。正交且 det = +1，满足刚体变换，见 src/AutoAimTypes.cpp 的校验。
#
# 这一项是「约定」不是「标定残差」：它由两系各轴怎么命名唯一决定，不需要实测。
# 本项与「相机光轴是否与枪管平行」是两回事，别混。
#    若相机支架本身存在安装偏角，那是一个真实的物理旋转，与坐标系怎么命名无关，
#    需另行标定，固定棋盘格 + 云台扫位姿 + cv::calibrateHandEye；本矩阵只覆盖"命名"这一层。
rotation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 0., 0., 1.,
         -1., 0., 0.,
          0.,-1., 0. ]

# 相机原点在云台坐标系中的位置 t_gimbal_camera，单位为 m。
# 本字段定义：从云台原点指向相机原点的向量，见 config/camera.yaml.example 与本结构体注释。
#
# 取值来源：2026-10-24 换相机后，车上那台机器的 CameraConfig.yaml 里
# vector_x / vector_y / vector_z = 70.8175 / 0 / 84.3059，单位 mm。
#   上一支镜头与上一副支架的旧值：`云台外参.md` 的 云台 P 轴 -> 相机光心 = (67.11, 0, 51.5)。
#   y 恰为 0、轴序同为 前 / 左 / 上，与旧值是同一个量、同一套读法。
#   z 从 51.5 涨到 84.3 mm，差 32.8 mm，只能来自支架或测量基准变了，
#   换镜头不会挪这么多。这一条未当场核对，若发现相机其实装回原位，
#   把本项换回 0.06711 / 0 / 0.0515；填错的表现是车心沿竖直方向整体偏 3.3 cm，
#   其余曲线都正常，很难反查。
#
# 学长 2026-10-13 答：外参是"云台 P 轴到相机光心"。本字段定义（从云台原点指向
# 相机原点，云台原点取 P 轴）与之同向，所以按学长所说，这三个数即本字段的值，
# 不取负：
#   t = (67.11, 0, 51.5) mm = (0.06711, 0, 0.0515) m
#
# 与 handout 正文有出入，待一句确认：`云台外参.md` 把这组数写成
# "相机光心到云台 P 轴"的向量，方向与本字段定义相反，按那句读应取负号
# (-0.06711, 0, -0.0515)。两处只能有一个对，本文件依学长的说法取正号。
# `docs/答辩-位姿解算.md` 的 §1.2、§1.3 与 `docs/img/坐标系方向.png` 的
# 侧视图已按正号统一（2026-10-15）。
#
# 轴序已定（2026-10-15）：handout 未明说这三个分量在哪个坐标系里量的，但同段还给了一个
# `云台P轴到摩擦轮的向量 74.1, 0.0, 0.0`。枪口必然在俯仰轴正前方，不可能横向偏 74.1 mm，
# 所以第一个分量是"前"。这与学长"云台系和世界系一样"（前 / 左 / 上）吻合，
# 于是 (67.11, 0, 51.5) 读作 前 67.11 / 左 0 / 上 51.5 mm，正是本文件云台系下的取值。
# 推导见 docs/上车前问题清单.md 第 1.1 节。
translation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ 0.0708175, 0.0, 0.0843059 ]

# 标定结果记录：标定那一次的平均重投影误差，单位 pixel。
# 它是标定工具输出的拟合残差，与运行时的 ArmorPose::reprojection_error 不是同一个量。
# 下面的 0.0753 是 2026-10-10 那轮本机标定的数，不是车上这轮内参的；车上那轮的值未取。
# 该字段被 src/AutoAimTypes.cpp:32 校验为必须 >= 0，无法用 -1 占位，故仍留旧值。
# 报告不使用这个数。
mean_reprojection_error_px: 0.0753
