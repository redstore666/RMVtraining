%YAML:1.0
---
# 此文件只定义填写格式，不含可用标定值。
# 完成标定后复制为实际配置文件，填写全部矩阵，并将 calibrated 改为 1。
calibrated: 1

# 标定图像分辨率，单位为 pixel；0 为无效占位值。
image_width: 1440
image_height: 1080

# 相机内参矩阵 K。
# 来源：2026-10-22 车上相机更新内参（CX/CY/FX/FY 由标定工具给出）。
# 旧值（1.8062e3 / 1.8047e3 / 738.8 / 526.3）已作废，勿再回填。
camera_matrix: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1.7826e+03, 0., 7.494e+02,
          0., 1.7843e+03, 5.747e+02,
          0., 0., 1. ]

# 畸变顺序必须与所选标定模型一致，并在报告中说明。
# OpenCV pinhole 五槽位顺序 [k1, k2, p1, p2, k3]。
# 2026-10-22 更新：k3 不再为 0（1.1905），切向 p1/p2 仍为 0。
distortion_coefficients: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -3.570e-02, -1.533e-01, 0., 0., 1.1905e+00 ]

# 从相机坐标系变换到云台坐标系的旋转矩阵 R_gimbal_camera。
# 全零矩阵是无效占位值，禁止将其视为单位旋转。
# 2026-10-22 状态：R 仍是单位阵占位（真实 R 需手眼标定，实车两次机会去测）。
# 代码侧已保证：R≈I 时视为占位并补"光学系(右/下/前)->云台系(前/左/上)"的
# 90° 固定旋转，同时仍然使用下面真实的 t；标定完成后直接替换本矩阵即可。
rotation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1., 0., 0.,
          0., 1., 0.,
          0., 0., 1. ] #无数据，暂时占位

# 相机原点在云台坐标系中的位置 t_gimbal_camera，
# 即从云台原点指向相机原点的平移向量，单位为 m。
translation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ 6.711e-02, 0., 5.150e-02  ]

# 标定结果记录；负数为未填写占位值。
# 2026-10-22 这组内参未附带 RMS，沿用上一组标定的 0.07 px；
# 重新标定内参时用 tools/calibrate_intrinsics 输出的 rms 覆盖此值。
mean_reprojection_error_px: 7.0e-02
