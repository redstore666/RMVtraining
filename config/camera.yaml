%YAML:1.0
---
# 上车配置（2026-10-25）：内参/外参全部为车上相机当前值。
# 来源与推导见 config/camera (同学1).yaml（同一台车上机器的完整推导版）；
# 数值取自车上机器自带的 CameraConfig.yaml（2026-10-24 标定 + vector 平移）。
calibrated: 1

# 标定图像分辨率，单位为 pixel；0 为无效占位值。
image_width: 1440
image_height: 1080

# 相机内参矩阵 K。
# 车上相机 2026-10-24 标定（10-24 换过镜头：fx 1782.6 -> 2433.8，是另一支镜头
# 而非重标；水平视场角 44.0 -> 33.0 度）。主点为未翻转值——本工程 get_pic
# 不做 180° 翻转，与标定原值直接对应，无需换算。
# 上一支镜头（2026-10-13~10-24，倒装）仅供对照：
#   fx 1782.6 / fy 1784.3 / cx 749.4 / cy 574.7（翻转后值）
#   dist [-3.570e-02, -1.533e-01, 0., 0., 1.1905]
camera_matrix: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 2.4338e+03, 0., 6.793e+02,
          0., 2.4374e+03, 5.718e+02,
          0., 0., 1. ]

# 畸变系数，OpenCV pinhole 五槽位 [k1, k2, p1, p2, k3]。
# 车上相机 2026-10-24 标定；四角径向因子 0.989~0.993（正常范围）。
distortion_coefficients: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.0129, -0.3517, 0., 0., -0.1536 ]

# 从相机坐标系变换到云台坐标系的旋转矩阵 R_gimbal_camera。
# 相机系 右/下/前，云台系 前/左/上，两系差 90° 置换（约定值，非标定残差）：
# 与代码占位回退用的 kOpticalToGimbal 完全相同——填入后旋转行为与占位期
# 逐比特一致，变化只有平移 t。若相机支架存在真实安装偏角，需另行手眼标定。
rotation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 0., 0., 1.,
         -1., 0., 0.,
          0., -1., 0. ]

# 相机原点在云台坐标系中的位置 t_gimbal_camera（云台原点取 P 轴），
# 轴序 前/左/上，单位 m。
# 来源：车上 CameraConfig.yaml 的 vector_x/y/z = 70.8175 / 0 / 84.3059 mm。
# 上一副支架旧值：(0.06711, 0, 0.0515)；z 差 32.8mm 来自支架/测量基准变化，
# 若实车发现相机装回了原位，换回旧值（表现：车心竖直方向整体偏 3.3cm）。
translation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ 0.0708175, 0., 0.0843059 ]

# 标定结果记录；车上这轮未附 RMS，沿用旧记录（报告不使用该数，仅须 >= 0）。
mean_reprojection_error_px: 7.0e-02
